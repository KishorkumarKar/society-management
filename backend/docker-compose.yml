version: '3.8'

services:
  mysql:
    image: mysql:8.3
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_dev_password
      MYSQL_DATABASE: society_management
      MYSQL_USER: society_app
      MYSQL_PASSWORD: change_me
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uroot', '-proot_dev_password']
      interval: 5s
      timeout: 5s
      retries: 10

  # Separate, disposable database for running the Jest suite against.
  mysql-test:
    image: mysql:8.3
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_dev_password
      MYSQL_DATABASE: society_management_test
      MYSQL_USER: society_app
      MYSQL_PASSWORD: change_me
    ports:
      - '3307:3306'
    tmpfs:
      - /var/lib/mysql # ephemeral — fresh DB every restart
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uroot', '-proot_dev_password']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306

volumes:
  mysql_data:
